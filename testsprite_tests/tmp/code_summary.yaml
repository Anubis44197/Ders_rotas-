version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React 19
  - Vite 6
  - Tailwind CSS 3
  - Recharts
  - Lucide React
  - Date-fns
routes:
  - path: /
    file: App.tsx
    auth_required: false
    description: Main landing screen where users choose between Student (Child) and Parent modes
  - path: /child
    file: components/child/ChildDashboard.tsx
    auth_required: false
    description: Student panel for viewing curriculum, tracking syllabus, logging study hours and completed questions
  - path: /parent/lockscreen
    file: App.tsx
    auth_required: false
    description: Password lockscreen gate before accessing parent settings and analytics
  - path: /parent/dashboard
    file: components/parent/ParentDashboard.tsx
    auth_required: true
    description: Main parent panel containing child academic analysis, risk models, study rotas, and planning workspaces
features:
  - name: Student Curriculum Checklist & Log
    description: Student logs study durations, logged questions, correctness rates, and completes tasks from curriculum
    files:
      - App.tsx
      - components/child/ChildDashboard.tsx
      - initialRealCurriculum.ts
    entry_route: /child
    user_interactions:
      - View list of curriculum tasks
      - Check/uncheck completed study items
      - Log duration, total questions, and correctness metrics
    api_calls: []
    auth_required: false
  - name: Parent PASSCODE Lock
    description: Lockscreen control gating parent visual dashboard access
    files:
      - App.tsx
    entry_route: /parent/lockscreen
    user_interactions:
      - Enter parent dashboard password code
      - Show incorrect password feedback message on failure
      - Redirect to parent home dashboard on success
    api_calls: []
    auth_required: false
  - name: Academic Performance Analytics & Graphs
    description: Recharts-powered graphs showcasing student progress, accuracy, active study hours, and subject distributions
    files:
      - components/parent/ParentDashboard.tsx
      - utils/analysisEngine.ts
    entry_route: /parent/dashboard
    user_interactions:
      - View overall completion rate bar charts
      - View correct question percentages pie charts
      - View study duration line graphs
    api_calls: []
    auth_required: true
  - name: Intelligent Rota Planning & Risk Assessment
    description: Automated study plans adjustments based on academic consistency, cognitive load limits, and performance thresholds
    files:
      - scripts/parent-decision-6000plus-safety.ts
      - types.ts
    entry_route: /parent/dashboard
    user_interactions:
      - Trigger plan recalculation
      - Adjust student daily curriculum loads
    api_calls: []
    auth_required: true
known_limitations:
  - issue: Performance bottlenecks when handling large study records (6000+)
    location: App.tsx
    impact: Re-rendering parent-child states on every action may freeze the interface on mobile/tablet devices
  - issue: Empty VirtualScroll utility component
    location: components/shared/VirtualScroll.tsx
    impact: Big lists are drawn on the DOM simultaneously instead of using virtual viewport virtualization, risking page crashes
